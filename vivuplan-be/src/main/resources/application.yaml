spring:
  application:
    name: vivuplan-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vivuplan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:vivuplan-super-secret-key-change-in-production-2026}
    expiration: 604800000 # 7 days ms
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
    openai:
      api-key: ${OPENAI_API_KEY:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://vivuplan.vn}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  auth:
    registration-otp-expiry-minutes: ${REGISTRATION_OTP_EXPIRY_MINUTES:10}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  email:
    from: ${SMTP_FROM:no-reply@vivuplan.vn}
    from-name: ${SMTP_FROM_NAME:VivuPlan}
  data-initializer:
    enabled: ${DATA_INITIALIZER_ENABLED:true}
  billing:
    order-expiry-minutes: ${BILLING_ORDER_EXPIRY_MINUTES:30}
    order-expiry-scan-ms: ${BILLING_ORDER_EXPIRY_SCAN_MS:10800000}
    sepay:
      webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
      qr-url-template: ${SEPAY_QR_URL_TEMPLATE:}
      bank-code: ${SEPAY_BANK_CODE:}
      account-number: ${SEPAY_ACCOUNT_NUMBER:}
      account-name: ${SEPAY_ACCOUNT_NAME:}
      order-prefix: ${SEPAY_ORDER_PREFIX:VP}

logging:
  level:
    com.vivuplan: DEBUG
    org.springframework.security: WARN
