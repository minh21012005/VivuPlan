spring:
  application:
    name: vivuplan-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vivuplan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:vivuplan-super-secret-key-change-in-production-2026}
    expiration: 604800000   # 7 days ms
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-1.5-flash
    openai:
      api-key: ${OPENAI_API_KEY:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://vivuplan.vn}

logging:
  level:
    com.vivuplan: DEBUG
    org.springframework.security: WARN
