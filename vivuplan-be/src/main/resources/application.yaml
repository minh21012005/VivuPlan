spring:
  application:
    name: vivuplan-be
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vivuplan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:vivuplan-super-secret-key-change-in-production-2026}
    expiration: ${JWT_EXPIRATION_MS:604800000} # 7 days ms
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      plan-max-output-tokens: ${GEMINI_PLAN_MAX_OUTPUT_TOKENS:32768}
      plan-thinking-budget: ${GEMINI_PLAN_THINKING_BUDGET:8192}
      regenerate-max-output-tokens: ${GEMINI_REGENERATE_MAX_OUTPUT_TOKENS:24576}
      regenerate-thinking-budget: ${GEMINI_REGENERATE_THINKING_BUDGET:6144}
      suggestion-max-output-tokens: ${GEMINI_SUGGESTION_MAX_OUTPUT_TOKENS:4096}
      suggestion-thinking-budget: ${GEMINI_SUGGESTION_THINKING_BUDGET:1536}
    cost:
      input-usd-per-1m: ${GEMINI_INPUT_USD_PER_1M:0.30}
      output-usd-per-1m: ${GEMINI_OUTPUT_USD_PER_1M:2.50}
      usd-to-vnd-rate: ${AI_COST_USD_TO_VND_RATE:26400}
    destination-suggest:
      cooldown-seconds: ${AI_DESTINATION_SUGGEST_COOLDOWN_SECONDS:60}
      cache-ttl-hours: ${AI_DESTINATION_SUGGEST_CACHE_TTL_HOURS:24}
  geocoding:
    activity:
      enabled: ${ACTIVITY_GEOCODE_ENABLED:true}
      nominatim-base-url: ${ACTIVITY_GEOCODE_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org/search}
      timeout-ms: ${ACTIVITY_GEOCODE_TIMEOUT_MS:3000}
      max-per-trip: ${ACTIVITY_GEOCODE_MAX_PER_TRIP:20}
      min-request-interval-ms: ${ACTIVITY_GEOCODE_MIN_REQUEST_INTERVAL_MS:1000}
    cache-cleanup:
      scan-ms: ${GEOCODE_CACHE_CLEANUP_SCAN_MS:86400000} # 24h
      stale-success-days: ${GEOCODE_CACHE_STALE_SUCCESS_DAYS:180} # xóa SUCCESS không dùng quá 180 ngày
      stale-negative-days: ${GEOCODE_CACHE_STALE_NEGATIVE_DAYS:30} # xóa NO_RESULT/LOW_CONFIDENCE sau 30 ngày
      stale-error-days: ${GEOCODE_CACHE_STALE_ERROR_DAYS:7} # xóa ERROR sau 7 ngày
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://vivuplan.xyz}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  auth:
    registration-otp-expiry-minutes: ${REGISTRATION_OTP_EXPIRY_MINUTES:10}
    registration-otp-cleanup-scan-ms: ${REGISTRATION_OTP_CLEANUP_SCAN_MS:10800000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  email:
    from: ${SMTP_FROM:no-reply@vivuplan.xyz}
    from-name: ${SMTP_FROM_NAME:VivuPlan}
  data-initializer:
    enabled: ${DATA_INITIALIZER_ENABLED:true}
  billing:
    order-expiry-minutes: ${BILLING_ORDER_EXPIRY_MINUTES:30}
    order-expiry-scan-ms: ${BILLING_ORDER_EXPIRY_SCAN_MS:10800000}
    sepay:
      webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
      qr-url-template: ${SEPAY_QR_URL_TEMPLATE:}
      bank-code: ${SEPAY_BANK_CODE:}
      account-number: ${SEPAY_ACCOUNT_NUMBER:}
      account-name: ${SEPAY_ACCOUNT_NAME:}
      order-prefix: ${SEPAY_ORDER_PREFIX:VP}

logging:
  level:
    com.vivuplan: DEBUG
    org.springframework.security: WARN
